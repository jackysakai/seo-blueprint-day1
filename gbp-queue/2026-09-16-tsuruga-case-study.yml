title: "監督署の立会い測定で局所排気装置と認定 捕捉風速0.7m/s"
post_type: "Call to action"
summary: |
  塗装作業場（エチルベンゼンを使用）に当社のBA400Tを設置し、現地の労働基準監督署の立会い測定を受けたところ、局所排気装置として認められました（2024年7月）。

  結果は、発生源から5cmの位置で捕捉風速0.7m/s。横向き吸引の目安である0.5m/sを上回る数値です。外部排気口は約30秒で0ppmまで安定しました。

  工事不要の可搬型でありながら、監督署の実測に耐える性能を確認しています。同じような課題をお持ちなら、まずは現場の状況をお聞かせください。
