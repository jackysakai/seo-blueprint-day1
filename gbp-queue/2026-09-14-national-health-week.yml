title: "10月は全国労働衛生週間 職場の有機溶剤対策を見直す機会に"
post_type: "Call to action"
summary: |
  10月1日から7日は全国労働衛生週間です。今年のスローガンは「ひとりひとりが貴重な人材 心も体も健やかに みんな生き生き健康職場」。この時期に合わせて、職場の化学物質対策を点検する企業が増えます。

  有機溶剤を扱う工程で局所排気装置が置けない、賃貸物件で工事ができない、というご相談を毎年この時期によくいただきます。当社のBAシリーズは工事不要、コンセントに挿すだけで使えるため、点検で見つかった課題にすぐ着手できます。

  累計160台以上の導入実績があります。労働衛生週間を機に、一度現場を見直してみませんか。
