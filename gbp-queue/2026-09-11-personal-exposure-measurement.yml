title: "個人ばく露測定が10月1日義務化 有機則の対象事業場は準備を"
post_type: "Call to action"
summary: |
  2026年10月1日から、有機則・特化則などが対象とする化学物質を扱う事業場で、個人ばく露測定が義務化されます。作業環境測定（A測定・B測定）とは別に、作業者一人ひとりの呼吸域の濃度を測る新しいルールです。

  これまで作業環境測定で「第一管理区分」だった現場でも、個人の測定結果が基準を超えるケースは起こり得ます。測定結果がよくなければ、局所排気装置の増設や、発生源そのものを抑える対策が必要になります。

  当社は、局所排気装置が置けない現場向けに、発生源の近くで有機溶剤蒸気を吸引する可搬型の装置をご用意しています。施行まで残りわずかです。まずは現状の作業内容をお聞かせください。
