title: "MEK400〜500ppmのドックを0ppmに 実測データを公開中"
post_type: "Call to action"
summary: |
  日用品メーカーの印刷ドック周辺では、MEK（メチルエチルケトン）の濃度が400〜500ppmに達していました。インクジェットプリンターのヘッド洗浄部やインク交換のドック付近は、蒸気がたまりやすい場所です。

  同じ現場にBA500Tを設置し、ホースをドック付近に近づけたところ、ドック・排気口ともに0ppmで安定しました（2024年7月、新コスモス電機XP-3160で測定）。

  印刷ライン特有の設置スペースやレイアウトに合わせたご提案も可能です。まずは現場の状況をお聞かせください。
