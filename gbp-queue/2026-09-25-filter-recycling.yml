title: "使用済み活性炭フィルターを無償回収 産業廃棄物ゼロへ"
post_type: "Call to action"
summary: |
  活性炭フィルター（C001・C002）は使用済みになった後、産業廃棄物として自社で処理する必要はありません。

  お客様元払いで当社まで送っていただければ、無償で回収・再生します。フィルター交換のたびに廃棄物処理を手配する手間がなくなり、環境負荷も抑えられます。

  対象外はBA100S用フィルターとHEPAフィルターのみです。交換時期の目安も個別にお伝えしています。
