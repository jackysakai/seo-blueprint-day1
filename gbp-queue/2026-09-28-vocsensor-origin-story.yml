title: "既製品に無かったVOCセンサーを自社開発した理由"
post_type: "Call to action"
summary: |
  発散防止抑制措置の特例実施許可には、精度の高いVOCセンサーが必須でした。ところが開発当時、既製品にはそれに見合う精度のセンサーが存在しませんでした。

  「発売時は同じような機器が存在しませんでした。需要はあったのに機器がないという状況だと感じました」と、開発を担当した酒井は振り返ります。センサーの開発が、製品化までの一番大きな山だったといいます。

  このセンサーが、今も装置の心臓部として働いています。
