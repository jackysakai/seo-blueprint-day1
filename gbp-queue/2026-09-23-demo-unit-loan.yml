title: "1週間のデモ機貸出あり 現場で効果を確かめてから導入を"
post_type: "Call to action"
summary: |
  設備投資だからこそ、自社の現場で本当に効果があるか確かめてから決めたい、というお声をよくいただきます。

  BA400・BA500シリーズは、1週間の有償デモ機貸出をご用意しています（国内・法人限定、1回のみ）。デモ料金は、ご購入いただく際にお支払い1回分から全額値引きします。往路の送料は当社負担です。

  まずは使用中の溶剤と作業内容をお知らせください。最適な機種をご案内します。
